version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # The image now defaults to a non-root user (required by Cloudflare
    # Containers). Local dev mounts a root-owned named volume for SQLite, so
    # run as root here to preserve the original write behaviour.
    user: "0:0"
    environment:
      # Local full-stack environment (SQLite + persistent volume). Production
      # deploys (Cloudflare) use APP_ENV=production with a real PostgreSQL
      # DATABASE_URL — the app refuses SQLite when APP_ENV=production.
      - APP_ENV=development
      - DATABASE_URL=sqlite+aiosqlite:////data/raksha.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173"]}
    volumes:
      - raksha_data:/data
      - /var/run/docker.sock:/var/run/docker.sock  # for sandbox
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  raksha_data:
