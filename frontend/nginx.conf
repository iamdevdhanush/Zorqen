server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Hashed Vite assets (JS / CSS / fonts / images) ──────────────────────
    # Vite emits content-hashed filenames under /assets/.
    # Safe to cache for 1 year — the hash is the cache-busting mechanism.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # ── HTML: always revalidate ──────────────────────────────────────────────
    # index.html and all SPA fallback routes must never be served stale.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    # ── Public static files (no content hash) ───────────────────────────────
    # Favicon, logo, robots, sitemap, icons — short 5-minute TTL.
    location ~* \.(svg|png|ico|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
