<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ZORQEN — Security Validation for AI-Built Software</title>
    <meta name="title" content="ZORQEN — Security Validation for AI-Built Software" />
    <meta name="description" content="Autonomous security validation for AI-generated code. Detect, reason, validate, and remediate vulnerabilities in repositories you control." />
    <meta name="author" content="ZORQEN" />
    <meta name="theme-color" content="#C5F82A" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical (default home; each route overrides via the Seo component) -->
    <link rel="canonical" href="https://app.zorqen.ai/" />

    <!-- Favicon / Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-title" content="ZORQEN" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZORQEN" />
    <meta property="og:title" content="ZORQEN — Security Validation for AI-Built Software" />
    <meta property="og:description" content="Autonomous security validation for AI-generated code. Detect, reason, validate, and remediate vulnerabilities in repositories you control." />
    <meta property="og:url" content="https://app.zorqen.ai/" />
    <meta property="og:image" content="https://app.zorqen.ai/logo.png" />
    <meta property="og:image:alt" content="ZORQEN — Security Validation for AI-Built Software" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZORQEN — Security Validation for AI-Built Software" />
    <meta name="twitter:description" content="Autonomous security validation for AI-generated code. Detect, reason, validate, and remediate vulnerabilities in repositories you control." />
    <meta name="twitter:image" content="https://app.zorqen.ai/logo.png" />

    <!-- Performance: font preconnect (fonts load only on pages that render them) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data: site-level default (pages override with more specific schemas) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "ZORQEN",
            "url": "https://app.zorqen.ai/",
            "logo": "https://app.zorqen.ai/logo.png",
            "description": "Autonomous security validation for AI-built software."
          },
          {
            "@type": "WebSite",
            "name": "ZORQEN",
            "url": "https://app.zorqen.ai/"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      type="text/javascript"
      src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js"

</html>
