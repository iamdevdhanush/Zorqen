# RAKSHA backend — Render Blueprint (optional).
# You can also create this service manually: New Web Service -> connect repo ->
# Root Directory `backend` -> Runtime `Docker`. The Dockerfile is authoritative;
# this file only documents the recommended production settings.
services:
  - type: web
    name: raksha-api
    runtime: docker
    repo: https://github.com/iamdevdhanush/Raksha-ai
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # REQUIRED: base64-encoded 32-byte key for AES-256-GCM encryption of
      # GitHub tokens at rest. Generate with:
      #   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
      # then set it here (sync: false → fill in the Render dashboard).
      # WARNING: keep this key stable across deploys — changing it makes all
      # stored GitHub tokens undecryptable until users re-authenticate.
      - key: ENCRYPTION_KEY
        sync: false
      # REQUIRED: Set DATABASE_URL to your Render PostgreSQL Internal URL.
      # Format: postgresql+asyncpg://USERNAME:PASSWORD@HOST:5432/DATABASE
      # (Render's postgres:// URLs are normalized automatically)
      - key: DATABASE_URL
        sync: false
      # REQUIRED: GitHub OAuth App credentials (from github.com/settings/applications/new)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # REQUIRED: Set to your Render backend URL for the OAuth callback
      # e.g. https://raksha-api.onrender.com/api/auth/github/callback
      - key: GITHUB_REDIRECT_URI
        sync: false
      # REQUIRED: Set to your Vercel frontend URL to allow CORS
      # e.g. ["https://raksha-ai-pink.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # REQUIRED: Set to your Vercel frontend URL
      # e.g. https://raksha-ai-pink.vercel.app
      - key: FRONTEND_URL
        sync: false
      # OPTIONAL: Groq API key for LLM-powered security reasoning and ASK RAKSHA
      - key: GROQ_API_KEY
        sync: false
      # OPTIONAL: xAI Grok API key for ASK RAKSHA (takes priority over Groq)
      - key: GROK_API_KEY
        sync: false
      # OPTIONAL: Grok model name (default: grok-4-latest)
      - key: GROK_MODEL
        value: grok-4-latest
