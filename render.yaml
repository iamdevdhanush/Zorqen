# ZORQEN backend — Render Blueprint (production backend).
# Create the service via Render Dashboard -> New Web Service -> connect repo ->
# Root Directory `backend` -> Runtime `Docker`, or deploy this Blueprint.
# The Dockerfile is authoritative; this file documents the recommended
# production settings for the new architecture:
#   Cloudflare = frontend (static assets)  ·  Render = FastAPI backend  ·  Supabase = PostgreSQL
services:
  - type: web
    name: zorqen-api
    runtime: docker
    repo: https://github.com/iamdevdhanush/Zorqen
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # REQUIRED: base64-encoded 32-byte key for AES-256-GCM encryption of
      # GitHub tokens at rest. Generate with:
      #   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
      # then set it here (sync: false → fill in the Render dashboard).
      # WARNING: keep this key stable across deploys — changing it makes all
      # stored GitHub tokens undecryptable until users re-authenticate.
      - key: ENCRYPTION_KEY
        sync: false
      # REQUIRED: Set DATABASE_URL to your Supabase PostgreSQL connection
      # string (Supabase -> Project Settings -> Database -> Connection string).
      # Format: postgresql+asyncpg://USERNAME:PASSWORD@HOST:5432/DATABASE
      # (postgres:// and postgresql:// URLs are normalized automatically)
      - key: DATABASE_URL
        sync: false
      # REQUIRED: GitHub OAuth App credentials (from github.com/settings/applications/new)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # REQUIRED: Set to your Render backend URL for the OAuth callback
      # e.g. https://zorqen-api.onrender.com/api/auth/github/callback
      - key: GITHUB_REDIRECT_URI
        sync: false
      # REQUIRED: Set to your Cloudflare frontend URL to allow CORS
      - key: CORS_ORIGINS
        value: '["https://app.zorqen.ai"]'
      # REQUIRED: Set to your Cloudflare frontend URL (OAuth redirect + trusted hosts)
      - key: FRONTEND_URL
        value: https://app.zorqen.ai
      # REQUIRED: Set to your Render backend URL (trusted hosts). Render
      # assigns the URL after the first deploy (e.g. https://zorqen-api.onrender.com).
      - key: BACKEND_URL
        sync: false
      # OPTIONAL: Groq API key for LLM-powered security reasoning and ASK ZORQEN
      - key: GROQ_API_KEY
        sync: false
      # OPTIONAL: Groq model name (default: openai/gpt-oss-20b).
      # WARNING: do NOT set llama-3.3-70b-versatile — Groq removed it (model_not_found).
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # OPTIONAL: xAI Grok API key for ASK ZORQEN (takes priority over Groq)
      - key: GROK_API_KEY
        sync: false
      # OPTIONAL: Grok model name (default: grok-4-latest)
      - key: GROK_MODEL
        value: grok-4-latest