      <text x="930" y="191" class="font-mono ink-text" font-size="12" font-weight="700">v2.4.0-RELEASE</text>

      <!-- Col 2 -->
      <text x="1120" y="174" class="font-mono muted-text" font-size="10" font-weight="700" letter-spacing="0.8">LICENSE MODEL</text>
      <text x="1120" y="191" class="font-mono ink-text" font-size="12" font-weight="700">OPEN SECURITY</text>

      <!-- Col 3 -->
      <text x="1320" y="174" class="font-mono muted-text" font-size="10" font-weight="700" letter-spacing="0.8">COMMUNITY TIER</text>
      <text x="1320" y="191" class="font-mono ink-text" font-size="12" font-weight="700">CORE SPONSOR</text>
