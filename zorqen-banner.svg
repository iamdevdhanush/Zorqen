    <line x1="32" y1="26" x2="32" y2="38" />
    <!-- Top Right -->
    <line x1="1562" y1="32" x2="1574" y2="32" />
    <line x1="1568" y1="26" x2="1568" y2="38" />
    <!-- Bottom Left -->
    <line x1="26" y1="368" x2="38" y2="368" />
    <line x1="32" y1="362" x2="32" y2="374" />
    <!-- Bottom Right -->
