      .panel-fill { fill: #FFFFFF; }
      .panel-head-fill { fill: #FAFAFA; }
      .accent-fill { fill: #C5F82A; }
      .ink-text { fill: #111111; }
      .muted-text { fill: #666666; }
      .subtle-text { fill: #333333; }
