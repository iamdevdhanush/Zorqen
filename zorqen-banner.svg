  <line x1="16" y1="46" x2="1584" y2="46" stroke="#E2E2D9" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="16" y1="354" x2="1584" y2="354" stroke="#E2E2D9" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="880" y1="46" x2="880" y2="354" stroke="#E2E2D9" stroke-width="1" stroke-dasharray="4,4" />

