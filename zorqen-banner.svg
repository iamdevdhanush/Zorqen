      <rect x="930" y="224" width="592" height="42" rx="6" class="accent-fill" stroke="#111111" stroke-width="2" />
      <text x="1226" y="250" text-anchor="middle" class="font-mono ink-text" font-size="13" font-weight="800" letter-spacing="0.8">SPONSOR ZORQEN DEVELOPMENT // BUY ME A COFFEE  →</text>
